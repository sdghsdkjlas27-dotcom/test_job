name: agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    environment: gate
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install agent CLI
        run: npm install -g opencode-ai@latest

      - name: Prepare
        env:
          TASK: ${{ secrets.TASK_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          task = json.loads(os.environ["TASK"])
          json.dump(task, open("task.json", "w"), ensure_ascii=False)
          p = task["provider"]
          cfg = {
              "$schema": "https://opencode.ai/config.json",
              "provider": {p["id"]: {
                  "npm": p["npm"],
                  "name": p.get("name", p["id"]),
                  "options": {"baseURL": p["baseURL"], "apiKey": p["apiKey"]},
                  "models": {p["model"]: {}},
              }},
              "model": f'{p["id"]}/{p["model"]}',
          }
          json.dump(cfg, open("opencode.json", "w"), indent=2)
          if task.get("target"):
              open(os.environ["GITHUB_ENV"], "a").write("HAS_TARGET=true\n")
          if task.get("deliver"):
              open(os.environ["GITHUB_ENV"], "a").write("HAS_DELIVER=true\n")
              snap = {k: v for k, v in task.items() if k != "deliver"}
              snap["deliver"] = {k: ("***" if k == "token" else v)
                                 for k, v in task["deliver"].items()}
              json.dump(snap, open("task_snapshot.json", "w"), indent=2, ensure_ascii=False)
              print("prepare ok (режим приватной доставки, вывод скрыт)")
          else:
              print("agent готов, модель:", cfg["model"])
          PY

      - name: Clone target
        if: env.HAS_TARGET == 'true'
        env:
          TASK: ${{ secrets.TASK_JSON }}
        run: |
          T=$(python3 -c "import json,os;print(json.loads(os.environ['TASK'])['target'])")
          git clone --depth 50 "https://github.com/$T.git" proj 2>&1 | tail -2
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/proj" >> "$GITHUB_ENV"
          echo "target: $T, файлов: $(find proj -type f -not -path '*/.git/*' | wc -l)"

      - name: Run agent
        run: |
          MODEL=$(python3 -c "import json;t=json.load(open('task.json'));print(t['provider']['id']+'/'+t['provider']['model'])")
          TASK=$(python3 - <<'PY'
          import json, os
          t = json.load(open("task.json"))["task"]
          if os.environ.get("PROJECT_DIR"):
              t += f"\n\nПроект для анализа УЖЕ склонирован в {os.environ['PROJECT_DIR']} — работай только внутри него, файлы воркспейса вне proj не трогай."
          t += f"\n\nРезультат пиши строго по абсолютному пути {os.environ['GITHUB_WORKSPACE']}/agent-findings.json."
          t += "\nФормат файла: валидный JSON-ОБЪЕКТ {\"findings\": [...]} — НЕ голый массив, БЕЗ markdown-заборов ``` и пояснений в файле."
          t += "\nПосле записи перечитай файл и убедись, что найденные баги реально в нём."
          print(t)
          PY
          )
          if [ "$HAS_DELIVER" = "true" ]; then
            opencode run --model "$MODEL" "$TASK" > agent.log 2>&1 || true
            echo "агент отработал; вывод скрыт, результаты уходят в приватное хранилище"
          else
            opencode run --model "$MODEL" "$TASK" 2>&1 | tee agent.log || true
            echo "=== хвост лога агента ==="
            tail -15 agent.log
          fi
          python3 - <<'PY'
          import json, os, glob, re

          raw = b""
          src = "корень воркспейса"
          if os.path.isfile("agent-findings.json"):
              raw = open("agent-findings.json", "rb").read()
          else:
              # агент мог записать файл в свой корень проекта (напр. proj/)
              cands = [p for p in glob.glob("**/agent-findings.json", recursive=True)
                       if ".git/" not in p and "node_modules" not in p]
              if cands:
                  cands.sort(key=os.path.getmtime)
                  raw = open(cands[-1], "rb").read()
                  src = cands[-1]
          if not raw and os.path.isfile("agent.log"):
              # файл исчез вовсе — тянем JSON из финального сообщения в логе.
              # raw_decode с конца: скобки внутри строк (#{...}) ему не страшны
              log = open("agent.log", encoding="utf-8", errors="replace").read()
              dec = json.JSONDecoder()
              i = len(log)
              while True:
                  i = log.rfind("{", 0, i)
                  if i < 0:
                      break
                  try:
                      obj = dec.raw_decode(log[i:])[0]
                  except Exception:
                      continue
                  if isinstance(obj, dict) and isinstance(obj.get("findings"), list):
                      raw = json.dumps(obj, ensure_ascii=False).encode()
                      src = "финальное сообщение агента"
                      print("файла не было, JSON вытащен из agent.log")
                      break

          d = None
          if raw:
              try:
                  d = json.loads(raw.decode("utf-8", "replace").strip().removeprefix("```json").removesuffix("```").strip("` \n"))
              except Exception as e:
                  print("сырой вывод не распарсился:", e)
                  open("agent-findings.raw.txt", "wb").write(raw[:10000])
          if isinstance(d, list):
              d = {"findings": d}
          if not isinstance(d, dict) or not isinstance(d.get("findings"), list):
              d = {"findings": []}

          KEYS = ["title", "file", "line", "severity", "description", "evidence", "repro", "fix_idea"]
          norm = []
          for f in d["findings"]:
              if not isinstance(f, dict):
                  continue
              g = dict(f)
              if "reproduction" in g and "repro" not in g:
                  g["repro"] = g.pop("reproduction")
              if "fix" in g and "fix_idea" not in g:
                  g["fix_idea"] = g.pop("fix")
              if "why" in g:
                  g["description"] = (g.get("description", "") + " " + g.pop("why")).strip()
              if not g.get("title"):
                  g["title"] = (g.get("description") or "finding")[:110]
              g.setdefault("severity", "major")
              g.setdefault("evidence", "")
              g["file"] = (str(g.get("file", ""))
                           .replace("/home/runner/work/test_job/test_job/", "")
                           .removeprefix("proj/"))
              norm.append({k: g.get(k) for k in KEYS})
          d = {"findings": norm}
          json.dump(d, open("agent-findings.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(f"ИСТОЧНИК: {src}")
          print(f"ВАЛИДАЦИЯ: findings = {len(norm)} шт.")
          for f in norm:
              print("  -", f.get("severity"), "|", f.get("title"), "|", f.get("file"), ":", f.get("line"))
          PY

      - name: Deliver
        if: env.HAS_DELIVER == 'true'
        env:
          TASK: ${{ secrets.TASK_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess, tempfile, datetime
          task = json.loads(os.environ["TASK"])
          d = task["deliver"]
          url = f"https://agent:{d['token']}@github.com/{d['repo']}.git"
          wdir = tempfile.mkdtemp()
          subprocess.run(["git", "clone", "--depth", "1", url, wdir],
                         check=True, capture_output=True)
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d_%H%M%S")
          out = os.path.join(wdir, stamp)
          os.makedirs(out, exist_ok=True)
          for f in ["agent-findings.json", "agent-findings.raw.txt", "agent.log", "task_snapshot.json"] + list(d.get("include", [])):
              if os.path.isfile(f):
                  shutil.copy(f, os.path.join(out, os.path.basename(f)))
          def git(*a):
              subprocess.run(["git", "-C", wdir, *a], check=True, capture_output=True)
          git("add", "-A")
          git("-c", "user.name=agent", "-c", "user.email=agent@workers.local",
              "commit", "-m", f"results {stamp}")
          subprocess.run(["git", "-C", wdir, "push"], check=True, capture_output=True)
          print("доставлено в приватное хранилище:", stamp)
          PY

      - name: Upload public artifact
        if: env.HAS_DELIVER != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-findings
          path: |
            agent-findings.json
            agent.log
          if-no-files-found: error
